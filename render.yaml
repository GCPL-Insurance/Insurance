services:
  # ── Backend API ──────────────────────────────────────────────────────────────
  - type: web
    name: insurance-portal-api
    runtime: node
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    plan: free
    envVars:
      - key: NODE_ENV
        value: production
      - key: SUPABASE_URL
        sync: false          # Set manually in Render dashboard
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false          # Set manually in Render dashboard
      - key: ALLOWED_ORIGINS
        sync: false          # Set to https://gcpl.insurance-portal.in,...
    healthCheckPath: /health

  # ── Frontend (Dashboard) ─────────────────────────────────────────────────────
  - type: web
    name: insurance-portal-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    plan: free
    envVars:
      - key: VITE_API_URL
        value: https://api.insurance-portal.in
      - key: VITE_COMPANY_NAME
        value: Global Calcium Pharmaceuticals
      - key: VITE_COMPANY_CODE
        value: GCPL
    routes:
      - type: rewrite
        source: /*
        destination: /index.html    # SPA routing fallback
